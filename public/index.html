<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI웹융합 — 학생 프로젝트 전시관</title>
<meta name="description" content="2026 AI웹융합 학생 프로젝트 모음">
<style>
:root {
  --bg: oklch(98% 0.005 90);
  --surface: oklch(100% 0 0);
  --ink: oklch(20% 0.02 90);
  --ink-soft: oklch(45% 0.02 90);
  --ink-muted: oklch(70% 0.01 90);
  --accent: oklch(55% 0.18 250);
  --accent-soft: oklch(95% 0.04 250);
  --live: oklch(65% 0.18 145);
  --down: oklch(60% 0.01 90);
  --rule: oklch(90% 0.005 90);
  --grid: oklch(95% 0.005 90);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px;
  background-position: -1px -1px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 clamp(1.5rem, 4vw, 4rem);
}

/* ============ Hero ============ */
.hero {
  padding: clamp(4rem, 10vw, 8rem) 0 clamp(2rem, 5vw, 4rem);
  border-bottom: 1px solid var(--rule);
}

.kicker {
  font-size: 0.8125rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 1.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-weight: 500;
}
.kicker::before {
  content: '';
  width: 2.5rem;
  height: 1px;
  background: currentColor;
}

h1 {
  font-size: clamp(2.5rem, 7vw, 6rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin-bottom: 2rem;
}
h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--accent) 0%, oklch(60% 0.2 290) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.lede {
  font-size: clamp(1.0625rem, 1.4vw, 1.25rem);
  max-width: 40rem;
  color: var(--ink-soft);
  line-height: 1.55;
}

.meta-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1.5rem 2.5rem;
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px dashed var(--rule);
  font-size: 0.875rem;
}
.meta-item {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}
.meta-label {
  color: var(--ink-muted);
  font-size: 0.6875rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
}
.meta-value {
  font-weight: 700;
  color: var(--ink);
  font-size: 1.125rem;
  font-variant-numeric: tabular-nums;
}

/* ============ Section ============ */
.section {
  padding: clamp(3rem, 6vw, 5rem) 0;
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 2rem;
  margin-bottom: 2.5rem;
  flex-wrap: wrap;
}
.section-title {
  font-size: clamp(1.5rem, 2.5vw, 2.125rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: baseline;
  gap: 0.875rem;
}
.section-title small {
  font-size: 0.75em;
  color: var(--ink-muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.legend {
  display: flex;
  gap: 1.5rem;
  font-size: 0.8125rem;
  color: var(--ink-soft);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.recheck {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 0.5rem 1rem;
  font-size: 0.8125rem;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.recheck:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.recheck svg {
  width: 14px;
  height: 14px;
  transition: transform 0.4s;
}
.recheck:hover svg { transform: rotate(180deg); }

/* ============ Grid ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 1.25rem;
}

/* ============ Card ============ */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  text-decoration: none;
  color: inherit;
  transition:
    transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
    border-color 0.3s,
    box-shadow 0.3s;
  isolation: isolate;
  overflow: hidden;
  min-height: 200px;
}

.card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), oklch(70% 0.18 290));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.card[data-status="live"] { cursor: pointer; }
.card[data-status="live"]:hover {
  transform: translateY(-4px);
  border-color: oklch(75% 0.08 250);
  box-shadow: 0 16px 36px -16px oklch(20% 0.05 250 / 0.18);
}
.card[data-status="live"]:hover::after { transform: scaleX(1); }

.card[data-status="down"] {
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.5;
  filter: grayscale(0.85);
}

.card[data-status="checking"] {
  pointer-events: none;
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
}

.card-num {
  font-size: 0.6875rem;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.1em;
  font-weight: 600;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  font-weight: 500;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-muted);
  position: relative;
}
[data-status="live"] .status-dot {
  background: var(--live);
  animation: pulse 2.4s ease-out infinite;
}
[data-status="down"] .status-dot { background: var(--down); }
[data-status="checking"] .status-dot {
  background: var(--accent);
  animation: pulse-fast 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 oklch(65% 0.18 145 / 0.5); }
  100% { box-shadow: 0 0 0 8px oklch(65% 0.18 145 / 0); }
}
@keyframes pulse-fast {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.card-name {
  font-size: 2.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  font-family: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  font-feature-settings: "ss01", "tnum";
  transition: font-size 0.3s ease, font-family 0.3s ease;
}
.card-name--title {
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.3;
  font-family: inherit;
  font-feature-settings: normal;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
}

.card-desc {
  font-size: 0.9375rem;
  color: var(--ink-soft);
  line-height: 1.5;
}

.card-foot {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.8125rem;
}
.card-domain {
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.75rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.01em;
}

/* ============ Stat badges ============ */
.card-stats {
  display: flex;
  align-items: center;
  gap: 0.875rem;
  font-size: 0.75rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}
.card-stats[data-loading="true"] { opacity: 0.4; }
.card-stat {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
}
.card-stat svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  opacity: 0.7;
}
/* ============ Sort control ============ */
.sort-control {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8125rem;
  color: var(--ink-soft);
}
.sort-control select {
  font-family: inherit;
  font-size: inherit;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 0.4rem 1.75rem 0.4rem 0.875rem;
  color: var(--ink);
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M2 4l3 3 3-3'/></svg>");
  background-repeat: no-repeat;
  background-position: right 0.625rem center;
  transition: border-color 0.2s, color 0.2s;
}
.sort-control select:hover { border-color: var(--accent); color: var(--accent); }
.sort-control select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-arrow {
  color: var(--ink-muted);
  transition: transform 0.3s, color 0.3s;
  font-size: 1.125rem;
  line-height: 1;
}
.card[data-status="live"]:hover .card-arrow {
  transform: translateX(4px);
  color: var(--accent);
}

/* ============ Empty / Footer ============ */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--ink-muted);
  border: 1px dashed var(--rule);
  border-radius: 12px;
  font-size: 0.9375rem;
}

footer {
  border-top: 1px solid var(--rule);
  padding: 2.5rem 0 4rem;
  margin-top: 3rem;
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}

@media (max-width: 640px) {
  body { background-size: 32px 32px; }
  .legend { gap: 1rem; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(15% 0.01 250);
    --surface: oklch(20% 0.012 250);
    --ink: oklch(96% 0.005 90);
    --ink-soft: oklch(70% 0.015 250);
    --ink-muted: oklch(50% 0.015 250);
    --accent: oklch(72% 0.16 250);
    --accent-soft: oklch(25% 0.04 250);
    --live: oklch(72% 0.18 145);
    --down: oklch(40% 0.01 90);
    --rule: oklch(28% 0.012 250);
    --grid: oklch(19% 0.012 250);
  }
  .card[data-status="live"]:hover {
    box-shadow: 0 16px 36px -16px oklch(0% 0 0 / 0.5);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="container">

  <header class="hero">
    <p class="kicker">2026 · AI웹융합</p>
    <h1>학생 프로젝트<br><em>전시관</em></h1>
    <p class="lede">
      각 학생에게 배정된 서브도메인입니다. 카드를 눌러 사이트로 이동하세요.
      배포되지 않은 사이트는 자동으로 회색 비활성 처리되며, 페이지 진입 시 상태를 실시간으로 점검합니다.
    </p>
    <div class="meta-bar">
      <div class="meta-item">
        <span class="meta-label">Course</span>
        <span class="meta-value">AI웹융합</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Total</span>
        <span class="meta-value" id="totalCount">—</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Live</span>
        <span class="meta-value" id="liveCount">—</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Last Check</span>
        <span class="meta-value" id="updateTime">—</span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">학생 페이지 <small id="subTitle"></small></h2>
      <div style="display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;">
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background: var(--live)"></span>접속 가능</span>
          <span class="legend-item"><span class="legend-dot" style="background: var(--down)"></span>오프라인</span>
        </div>
        <label class="sort-control">
          정렬
          <select id="sortSelect">
            <option value="slot">번호순</option>
            <option value="reactions">반응 많은 순</option>
            <option value="comments">댓글 많은 순</option>
          </select>
        </label>
        <button class="recheck" id="recheckBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
          다시 확인
        </button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <span>© 2026 AI웹융합 · 학생 프로젝트 전시관</span>
    <span>Hosted on Cloudflare Pages</span>
  </footer>

</div>

<script>
// ============================================
//  설정
// ============================================
// 메타데이터(타이틀) 추출 엔드포인트
//   - "/api/meta": 같은 Pages 프로젝트의 Function 사용 (functions/api/meta.js) — 권장
//   - "https://...workers.dev": 별도 Worker로 배포한 경우
//   - "" (빈 문자열): 비활성화 — 슬롯 코드(s01)만 표시
const META_PROXY = "/api/meta";

// ============================================
//  학생 데이터는 /api/students 에서 동적으로 로드 (Google Sheet 기반)
//  → 시트에 행만 추가하면 갤러리에 자동 등장. 소스 수정 불필요.
//  → 마지막 성공 응답은 localStorage에 캐시 (시트 일시 다운 대비)
// ============================================
const STUDENTS_CACHE_KEY = 'aiweb2026-students-v1';
let STUDENTS = [];
// ============================================

const grid = document.getElementById('grid');
const totalEl = document.getElementById('totalCount');
const liveEl = document.getElementById('liveCount');
const updateEl = document.getElementById('updateTime');
const subTitleEl = document.getElementById('subTitle');
const recheckBtn = document.getElementById('recheckBtn');

function getDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function getSlot(url) {
  try { return new URL(url).hostname.split('.')[0]; }
  catch { return ''; }
}

function renderCards() {
  if (STUDENTS.length === 0) {
    grid.innerHTML = `<div class="empty">아직 등록된 프로젝트가 없습니다.</div>`;
    return;
  }
  grid.innerHTML = STUDENTS.map((s, i) => {
    const slot = getSlot(s.url);
    return `
    <a class="card" data-status="checking" data-url="${escapeHtml(s.url)}"
       href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer"
       title="${escapeHtml(s.name)}"
       aria-busy="true">
      <div class="card-header">
        <span class="card-num">${String(i + 1).padStart(2, '0')} / ${String(STUDENTS.length).padStart(2, '0')}</span>
        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">확인 중</span>
        </span>
      </div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(slot)}</div>
        <div class="card-desc" data-fallback="${escapeHtml(s.desc || '')}">${escapeHtml(s.desc || '')}</div>
      </div>
      <div class="card-stats" data-loading="true" data-slot="${escapeHtml(slot)}">
        <span class="card-stat" title="GitHub Discussions 반응 합계">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="card-stat-reactions">—</span>
        </span>
        <span class="card-stat" title="GitHub Discussions 댓글 합계">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="card-stat-comments">—</span>
        </span>
      </div>
      <div class="card-foot">
        <span class="card-domain">${escapeHtml(getDomain(s.url))}</span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </div>
    </a>
  `;}).join('');
}

async function fetchMeta(url, timeoutMs = 10000) {
  // META_PROXY가 없으면 단순 liveness 체크만
  if (!META_PROXY) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      await fetch(url, {
        mode: 'no-cors',
        cache: 'no-store',
        redirect: 'follow',
        signal: controller.signal,
      });
      return { ok: true, title: null, description: null };
    } catch {
      return { ok: false, title: null, description: null };
    } finally {
      clearTimeout(timer);
    }
  }

  // Worker 프록시를 통해 title/description까지 추출
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const sep = META_PROXY.includes('?') ? '&' : '?';
    const proxyUrl = `${META_PROXY}${sep}url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl, { signal: controller.signal });
    if (!res.ok) return { ok: false, title: null, description: null };
    const data = await res.json();
    return {
      ok: !!data.ok,
      title: data.title || null,
      description: data.description || null,
    };
  } catch {
    return { ok: false, title: null, description: null };
  } finally {
    clearTimeout(timer);
  }
}

async function runChecks() {
  const cards = document.querySelectorAll('.card');
  cards.forEach(c => {
    c.dataset.status = 'checking';
    c.setAttribute('aria-busy', 'true');
    const txt = c.querySelector('.status-text');
    if (txt) txt.textContent = '확인 중';
  });
  liveEl.textContent = '—';
  updateEl.textContent = '확인 중…';

  let live = 0;
  await Promise.all(Array.from(cards).map(async card => {
    const url = card.dataset.url;
    const meta = await fetchMeta(url);
    const ok = meta.ok;
    card.dataset.status = ok ? 'live' : 'down';
    card.setAttribute('aria-busy', 'false');

    const statusText = card.querySelector('.status-text');
    if (statusText) statusText.textContent = ok ? 'Live' : 'Offline';

    // 타이틀이 잡히면 카드 라벨을 슬롯 → 실제 페이지 제목으로 교체
    if (ok && meta.title) {
      const nameEl = card.querySelector('.card-name');
      if (nameEl) {
        nameEl.textContent = meta.title;
        nameEl.classList.add('card-name--title');
      }
    }

    // description이 잡히면 fallback을 실제 meta description으로 교체
    if (ok && meta.description) {
      const descEl = card.querySelector('.card-desc');
      if (descEl) descEl.textContent = meta.description;
    }

    if (ok) {
      live += 1;
    } else {
      card.removeAttribute('href');
      card.setAttribute('aria-disabled', 'true');
    }
    liveEl.textContent = live;
  }));

  updateEl.textContent = new Date().toLocaleTimeString('ko-KR', {
    hour: '2-digit', minute: '2-digit'
  });
}

// 시트에서 학생 목록 로드 → 실패 시 localStorage 캐시 → 둘 다 없으면 빈 갤러리
async function loadStudents() {
  try {
    const res = await fetch('/api/students', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.ok && Array.isArray(data.students) && data.students.length > 0) {
        STUDENTS = data.students;
        try { localStorage.setItem(STUDENTS_CACHE_KEY, JSON.stringify(data.students)); } catch {}
        return;
      }
    }
  } catch {}
  // fallback — 마지막 성공 응답 재사용
  try {
    const cached = localStorage.getItem(STUDENTS_CACHE_KEY);
    if (cached) STUDENTS = JSON.parse(cached);
  } catch {}
}

// ============================================
//  GitHub stats (giscus 반응/댓글, repo pushed_at) — /api/stats
// ============================================
let STATS = {}; // { s01: { reactions, comments, pushedAt }, ... }
const sortSelect = document.getElementById('sortSelect');

function applyStatsToCards() {
  document.querySelectorAll('.card-stats').forEach(el => {
    const slot = el.dataset.slot;
    const s = STATS[slot];
    el.dataset.loading = 'false';
    el.querySelector('.card-stat-reactions').textContent = (s && s.ok !== false) ? (s.reactions ?? 0) : 0;
    el.querySelector('.card-stat-comments').textContent  = (s && s.ok !== false) ? (s.comments  ?? 0) : 0;
  });
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.stats) {
      STATS = data.stats;
      applyStatsToCards();
      // 현재 sort가 stats 기반이면 재정렬
      if (sortSelect.value !== 'slot') sortAndRender();
    }
  } catch {}
}

function sortStudents(students, key) {
  const copy = students.slice();
  if (key === 'reactions') {
    copy.sort((a, b) => (STATS[b.slot]?.reactions || 0) - (STATS[a.slot]?.reactions || 0)
                       || a.slot.localeCompare(b.slot, 'en', { numeric: true }));
  } else if (key === 'comments') {
    copy.sort((a, b) => (STATS[b.slot]?.comments || 0) - (STATS[a.slot]?.comments || 0)
                       || a.slot.localeCompare(b.slot, 'en', { numeric: true }));
  } else {
    copy.sort((a, b) => a.slot.localeCompare(b.slot, 'en', { numeric: true }));
  }
  return copy;
}

// 카드를 현재 sort 기준으로 다시 그림. meta(title/description)와 status는
// 카드 DOM에 남아있는 값을 보존하면서 순서만 바꿈.
function sortAndRender() {
  const sorted = sortStudents(STUDENTS, sortSelect.value);
  // 현재 카드 DOM을 slot으로 인덱싱
  const cardBySlot = {};
  document.querySelectorAll('.card').forEach(c => {
    const slot = c.dataset.url ? getSlot(c.dataset.url) : '';
    if (slot) cardBySlot[slot] = c;
  });
  // 원래 카드가 없으면 새로 그림 (초기 렌더 또는 학생 목록 변경 시)
  const allPresent = sorted.every(s => cardBySlot[s.slot]);
  if (!allPresent) {
    STUDENTS = sorted;
    renderCards();
    applyStatsToCards();
    return;
  }
  // 있으면 기존 노드를 새 순서로 다시 append
  STUDENTS = sorted;
  sorted.forEach((s, i) => {
    const card = cardBySlot[s.slot];
    grid.appendChild(card);
    // 번호 라벨도 새 순서로 갱신
    const num = card.querySelector('.card-num');
    if (num) num.textContent = `${String(i + 1).padStart(2, '0')} / ${String(sorted.length).padStart(2, '0')}`;
  });
}

sortSelect.addEventListener('change', sortAndRender);

// 초기화
(async () => {
  totalEl.textContent = '…';
  subTitleEl.textContent = '로딩 중';
  await loadStudents();
  // 처음엔 항상 번호순으로 렌더
  STUDENTS = sortStudents(STUDENTS, 'slot');
  totalEl.textContent = STUDENTS.length;
  subTitleEl.textContent = `${STUDENTS.length}개`;
  renderCards();
  // meta(라이브 체크 + title/desc)와 stats는 병렬로 로드
  runChecks();
  loadStats();
})();

function resetCards() {
  document.querySelectorAll('.card').forEach(c => {
    const slot = c.dataset.url ? getSlot(c.dataset.url) : '';
    const s = STUDENTS.find(x => x.slot === slot);
    if (!s) return;
    c.setAttribute('href', s.url);
    c.removeAttribute('aria-disabled');
    // 라벨을 다시 슬롯 코드로 되돌림 (재확인 시 깜빡 후 새 타이틀로 교체)
    const nameEl = c.querySelector('.card-name');
    if (nameEl) {
      nameEl.textContent = getSlot(s.url);
      nameEl.classList.remove('card-name--title');
    }
    // 설명도 fallback으로 되돌림
    const descEl = c.querySelector('.card-desc');
    if (descEl) descEl.textContent = descEl.dataset.fallback || '';
  });
}

// 버튼: 다시 확인 — meta + stats 모두 갱신
recheckBtn.addEventListener('click', () => {
  resetCards();
  runChecks();
  loadStats();
});

// 5분마다 자동 재확인
setInterval(() => {
  resetCards();
  runChecks();
  loadStats();
}, 5 * 60 * 1000);
</script>
